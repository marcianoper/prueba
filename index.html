<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoja de Viaje - VDC360°</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.6/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { text-align: center; }
    .section { border: 1px solid #ddd; padding: 10px; margin-bottom: 20px; }
    .section h2 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    input[type="number"] { width: 80px; }
    .btn { padding: 6px 12px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; margin-top: 5px; }

    /* ====== NUEVO: estilos del marcador ====== */
    .mark-select{
      width: 120px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #cfd3d8;
      background: #fff;
      font-weight: 700;
    }
    .row-mark-none { background: transparent; }
    .row-mark-yellow { background: rgba(255, 235, 59, .35); }
    .row-mark-blue { background: rgba(33, 150, 243, .20); }
    .row-mark-green { background: rgba(76, 175, 80, .20); }
    .row-mark-red { background: rgba(244, 67, 54, .18); }
    .row-mark-purple { background: rgba(156, 39, 176, .16); }

    /* ====== NUEVO: pill realtime ====== */
    .rt-pill{
      display:inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      background:#eef7ef;
      color:#1f6f26;
      border:1px solid rgba(0,0,0,.08);
      margin-left: 10px;
    }
    .rt-pill.off{
      background:#fff1f2;
      color:#b91c1c;
    }
  </style>
</head>
<body>
  <a href="https://marcianoper.github.io/vdc-central/"
   style="
     position:fixed;
     top:12px;
     left:12px;
     background:#0a7a3b;
     color:#fff;
     padding:10px 14px;
     border-radius:12px;
     text-decoration:none;
     font-weight:900;
     z-index:9999;
     box-shadow:0 10px 20px rgba(0,0,0,.15);
   ">
  ← VDC Central
</a>

  <h1>
    Hoja de Viaje - VDC360°
    <span id="rt" class="rt-pill">REAL TIME</span>
  </h1>

  <label><strong>Fecha del viaje:</strong> <input type="date" id="fechaViaje"></label>
  <div id="contenedorProductos"></div>

  <button class="btn" onclick="guardarViaje()">Guardar Viaje</button>
  <button class="btn" onclick="mostrarHistorial()">Ver Historial</button>
  <button class="btn" onclick="generarResumenTotales()">Generar Documento de Totales</button>

  <div id="historialContainer" style="margin-top: 30px;"></div>

  <script>
    /* ========= CLIENTE SUPABASE ========= */
    const supabase = window.supabase.createClient(
      'https://rcegikeiaxptolrduguc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZWdpa2VpYXhwdG9scmR1Z3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU2NTMyMDcsImV4cCI6MjA3MTIyOTIwN30.jbPM9F977zeITEmFA_xvVU6SCxlWWVCi3Dx7ZhFfTp8'
    );

    /* ========= REALTIME LIVE TABLE ========= */
    const LIVE_TABLE = 'hoja_viaje_live';

    /* ========= DEVICE ID (para no “rebotar” tus propios updates) ========= */
    const DEVICE_ID = (() => {
      const k = 'vdc_device_id';
      let v = localStorage.getItem(k);
      if(!v){
        v = 'dev_' + Math.random().toString(16).slice(2) + '_' + Date.now();
        localStorage.setItem(k, v);
      }
      return v;
    })();

    /* ========= LISTA DE PRODUCTOS ========= */
    const productos = ['Cabeza de res', 'Tripa de res', 'Menudo sucio', 'Cuajo de res', 'Pata sucia', 'Hígado', 'Libro de res', 'Teleco', 'Corazón'];

    function $(s){ return document.querySelector(s); }

    function todayISO(){
      const d = new Date();
      const z = d.getTimezoneOffset() * 60000;
      return new Date(d - z).toISOString().slice(0,10);
    }

    function getID(producto) {
      return producto.toLowerCase().replace(/\s+/g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function crearTabla(producto) {
      const id = getID(producto);
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h2>${producto}</h2>
        <table id="tabla-${id}">
          <thead>
            <tr>
              <th>Kg</th>
              <th>Piezas</th>
              <th>Marcador</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button class="btn agregar-btn" data-producto="${producto}">Agregar Pesada</button>
        <p><strong>Total Kg:</strong> <span id="totalKg-${id}">0</span> |
           <strong>Total Pzas:</strong> <span id="totalPzas-${id}">0</span></p>`;
      document.getElementById('contenedorProductos').appendChild(section);
    }

    /* ========= marcador por fila ========= */
    const MARKS = [
      { key: 'none',   label: 'Sin marca',   cls: 'row-mark-none' },
      { key: 'yellow', label: 'Cliente A',   cls: 'row-mark-yellow' },
      { key: 'blue',   label: 'Cliente B',   cls: 'row-mark-blue' },
      { key: 'green',  label: 'Cliente C',   cls: 'row-mark-green' },
      { key: 'red',    label: 'Urgente',     cls: 'row-mark-red' },
      { key: 'purple', label: 'Especial',    cls: 'row-mark-purple' },
    ];

    function markToClass(markKey){
      const f = MARKS.find(m => m.key === markKey);
      return (f ? f.cls : 'row-mark-none');
    }

    function buildMarkSelect(selectedKey = 'none'){
      const sel = document.createElement('select');
      sel.className = 'mark-select';
      sel.innerHTML = MARKS.map(m => `<option value="${m.key}" ${m.key===selectedKey?'selected':''}>${m.label}</option>`).join('');
      return sel;
    }

    function applyRowMark(row, markKey){
      MARKS.forEach(m => row.classList.remove(m.cls));
      row.classList.add(markToClass(markKey));
      row.dataset.mark = markKey || 'none';
    }

    /* ========= FILAS Y TOTALES ========= */
    function agregarFila(producto, kgValue = '', pzasValue = '', markKey = 'none') {
      const id = getID(producto);
      const tabla = document.querySelector(`#tabla-${id} tbody`);
      const fila = document.createElement('tr');

      const markSelect = buildMarkSelect(markKey);
      markSelect.addEventListener('change', () => {
        applyRowMark(fila, markSelect.value);
        actualizarTotales(producto);
        scheduleSaves();
      });

      fila.innerHTML = `
        <td><input type="number" step="0.1" value="${kgValue}" onchange="actualizarTotales('${producto}'); scheduleSaves();"></td>
        <td><input type="number" value="${pzasValue}" onchange="actualizarTotales('${producto}'); scheduleSaves();"></td>
        <td class="mark-cell"></td>
        <td><button class="btn" onclick="eliminarFila(this)">Eliminar</button></td>`;

      fila.querySelector('.mark-cell').appendChild(markSelect);
      tabla.appendChild(fila);

      applyRowMark(fila, markKey || 'none');

      actualizarTotales(producto);
      scheduleSaves();
    }

    function eliminarFila(btn) {
      const row = btn.parentNode.parentNode;
      const producto = row.closest('.section').querySelector('h2').textContent;
      row.remove();
      actualizarTotales(producto);
      scheduleSaves();
    }

    function actualizarTotales(producto) {
      const id = getID(producto);
      const filas = document.querySelectorAll(`#tabla-${id} tbody tr`);
      let totalKg = 0;
      let totalPzas = 0;
      filas.forEach(row => {
        const kg = parseFloat(row.children[0].children[0].value) || 0;
        const pzas = parseFloat(row.children[1].children[0].value) || 0;
        totalKg += kg;
        totalPzas += pzas;
      });
      document.getElementById(`totalKg-${id}`).textContent = totalKg.toFixed(1);
      document.getElementById(`totalPzas-${id}`).textContent = totalPzas;
    }

    /* ========= GUARDAR / HISTORIAL / RESUMEN ========= */
    async function guardarViaje() {
      const fecha = document.getElementById('fechaViaje').value;
      if (!fecha) return alert("⚠️ Por favor selecciona una fecha.");

      const resultados = recolectarResultados();

      const { data, error } = await supabase
        .from('hoja_viaje')
        .insert([{ fecha, resultados }])
        .select()
        .single();

      if (error) {
        alert("❌ Error al guardar: " + error.message);
      } else {
        alert("✅ Viaje guardado correctamente.");
        if (data && data.id) {
          window.viaje_id = data.id;
          await saveLive(); // deja el estado live actualizado
          saveLocal();
        }
      }
    }

    async function mostrarHistorial() {
      const { data, error } = await supabase.from('hoja_viaje').select('*').order('fecha', { ascending: false });
      const contenedor = document.getElementById('historialContainer');
      contenedor.innerHTML = '';

      if (error) {
        contenedor.innerHTML = '<p style="color:red;">❌ Error al cargar historial: ' + error.message + '</p>';
        return;
      }

      if (!data || data.length === 0) {
        contenedor.innerHTML = '<p>No hay viajes registrados.</p>';
        return;
      }

      const tabla = document.createElement('table');
      tabla.style.width = '100%';
      tabla.border = 1;
      tabla.innerHTML = '<thead><tr><th>Fecha</th><th>Resumen</th></tr></thead><tbody>' +
        data.map(row => `<tr><td>${row.fecha}</td><td><pre>${JSON.stringify(row.resultados, null, 2)}</pre></td></tr>`).join('') +
        '</tbody>';
      contenedor.appendChild(tabla);
    }

    async function generarResumenTotales() {
      const { data, error } = await supabase.from('hoja_viaje').select('*');
      if (error || !data) return alert('❌ Error al obtener datos: ' + error.message);

      const totales = {};
      data.forEach(row => {
        const prods = row.resultados || {};
        Object.keys(prods).forEach(nombre => {
          prods[nombre].forEach(r => {
            if (!totales[nombre]) totales[nombre] = { kg: 0, pzas: 0 };
            totales[nombre].kg += r.kg || 0;
            totales[nombre].pzas += r.pzas || 0;
          });
        });
      });

      let html = '<h1>Resumen Total de Kilos y Piezas</h1>';
      html += '<table border="1" cellpadding="6"><tr><th>Producto</th><th>Total Kg</th><th>Total Pzas</th></tr>';
      Object.entries(totales).forEach(([nombre, valores]) => {
        html += `<tr><td>${nombre}</td><td>${valores.kg.toFixed(1)}</td><td>${valores.pzas}</td></tr>`;
      });
      html += '</table>';

      const blob = new Blob([`<html><body>${html}</body></html>`], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    /* ========= AUTOSAVE LOCAL + LIVE ========= */
    const MODULE = 'hoja_viaje';
    let dirty=false, tLocal=null, tLive=null;
    let rtSub = null;
    let applyingRemote = false;

    function getFechaISO(){ return document.getElementById('fechaViaje')?.value || todayISO(); }

    function liveKey(){ return `viaje-${getFechaISO()}`; } // clave por fecha (como tu realtime del mostrador)

    function recolectarResultados(){
      const resultados = {};
      productos.forEach(producto => {
        const id = getID(producto);
        const filas = document.querySelectorAll(`#tabla-${id} tbody tr`);
        resultados[producto] = [];
        filas.forEach(row => {
          const kg = parseFloat(row.children[0].children[0].value) || 0;
          const pzas = parseFloat(row.children[1].children[0].value) || 0;
          const mark = row.dataset.mark || 'none';
          if (kg || pzas) resultados[producto].push({ kg, pzas, mark });
        });
      });
      return resultados;
    }

    function collectState(){
      return { fecha: getFechaISO(), resultados: recolectarResultados() };
    }

    function aplicarResultados(resultados){
      if(!resultados) return;
      productos.forEach(producto => {
        const id = getID(producto);
        const tbody = document.querySelector(`#tabla-${id} tbody`);
        tbody.innerHTML = '';
        const rows = resultados[producto] || [];
        rows.forEach(r => agregarFila(producto, r.kg || '', r.pzas || '', r.mark || 'none'));
        if(rows.length === 0) { actualizarTotales(producto); }
      });
    }

    function applyState(state){
      if(!state) return;
      if(state.fecha){ document.getElementById('fechaViaje').value = state.fecha; }
      aplicarResultados(state.resultados || {});
    }

    // LocalStorage
    function lkey(){ return `draft:${MODULE}:${liveKey()}`; }
    function saveLocal(){
      localStorage.setItem(lkey(), JSON.stringify({ts:Date.now(), data:collectState()}));
      dirty=true;
    }
    function loadLocal(){
      const raw=localStorage.getItem(lkey());
      if(!raw) return;
      try{ applyState(JSON.parse(raw).data); }catch{}
    }

    // LIVE (Supabase)
    async function saveLive(){
      // evita mandar de regreso lo que llega remoto
      if(applyingRemote) return;

      const state = collectState();
      const row = {
        id: liveKey(),
        fecha: state.fecha,
        data: state,
        updated_at: new Date().toISOString(),
        updated_by: DEVICE_ID
      };

      const { error } = await supabase
        .from(LIVE_TABLE)
        .upsert([row], { onConflict: 'id' });

      if(error){
        console.log("LIVE UPSERT ERROR:", error);
        setRtPill(false, 'RT OFF');
      }else{
        setRtPill(true, 'REAL TIME');
      }
    }

    async function loadLive(){
      const { data, error } = await supabase
        .from(LIVE_TABLE)
        .select('data, updated_by, updated_at')
        .eq('id', liveKey())
        .single();

      if(error) return;

      if(data && data.data){
        applyingRemote = true;
        applyState(data.data);
        applyingRemote = false;
      }
    }

    function setRtPill(on, text){
      const pill = $('#rt');
      if(!pill) return;
      pill.textContent = text || (on ? 'REAL TIME' : 'RT OFF');
      pill.classList.toggle('off', !on);
    }

    function subscribeLive(){
      if(rtSub){
        try{ supabase.removeSubscription(rtSub); }catch(e){}
        rtSub = null;
      }

      // v1 realtime: escuchamos UPDATE + INSERT en la fila id=liveKey()
      rtSub = supabase
        .from(`${LIVE_TABLE}:id=eq.${liveKey()}`)
        .on('INSERT', payload => onLivePayload(payload))
        .on('UPDATE', payload => onLivePayload(payload))
        .subscribe((status)=>{
          if(status === 'SUBSCRIBED') setRtPill(true, 'REAL TIME');
        });
    }

    function onLivePayload(payload){
      try{
        const row = payload.new || payload.record || null;
        if(!row) return;

        // no aplicar nuestros propios updates
        if(row.updated_by && row.updated_by === DEVICE_ID) return;

        if(row.data){
          applyingRemote = true;
          applyState(row.data);
          applyingRemote = false;
          dirty = true;
        }
      }catch(e){
        console.log("LIVE PAYLOAD ERROR:", e);
      }
    }

    function scheduleSaves(){
      clearTimeout(tLocal);
      tLocal=setTimeout(saveLocal, 400);

      clearTimeout(tLive);
      tLive=setTimeout(saveLive, 700);
    }

    // Autosave global
    document.addEventListener('input', (e)=>{
      if (e.target.matches('input,select,textarea')) scheduleSaves();
    });

    // Aviso al salir con cambios
    window.addEventListener('beforeunload', (e)=>{
      if(!dirty) return;
      e.preventDefault();
      e.returnValue='';
    });

    // Cambio de fecha => cambia la “sala” realtime (otra key)
    document.getElementById('fechaViaje')?.addEventListener('change', async ()=>{
      // carga live de esa fecha y se suscribe a esa fecha
      applyingRemote = true;
      await loadLive();
      loadLocal();
      applyingRemote = false;
      subscribeLive();
    });

    /* ========= ARRANQUE ========= */
    document.addEventListener('DOMContentLoaded', async () => {
      productos.forEach(crearTabla);

      document.addEventListener('click', function(e) {
        if (e.target.classList.contains('agregar-btn')) {
          const producto = e.target.getAttribute('data-producto');
          agregarFila(producto);
        }
      });

      // Fecha hoy por defecto
      document.getElementById('fechaViaje').value = todayISO();

      // 1) cargar LIVE primero (si existe), 2) luego local como fallback
      await loadLive();
      loadLocal();

      // 3) suscribir realtime para esa fecha
      subscribeLive();

      // 4) si no había nada en live, sube el estado inicial vacío (para “crear la sala”)
      await saveLive();
    });
  </script>
</body>
</html>
