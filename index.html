<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hoja de pesos y sebo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    body { font-family: sans-serif; background:#f2f2f2; padding:30px; }
    .container { background:#fff; padding:40px; border-radius:12px; max-width:900px; margin:auto; }
    h1 { margin:0 0 12px; font-size:32px; }
    h2 { margin-top:0; }
    label { display:block; margin-top:18px; font-weight:700; }
    input, textarea {
      width:100%; padding:10px; font-size:16px; margin-top:6px;
      border:1px solid #d1d5db; border-radius:10px;
    }
    textarea { min-height:120px; resize:vertical; }

    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-top:14px; }
    .row > div { flex:1 1 220px; }

    button {
      padding:12px 18px; border:none; border-radius:10px;
      background:#198754; color:#fff; font-size:16px; cursor:pointer;
    }
    button:hover { background:#146c43; }

    .btn-gray{ background:#374151; }
    .btn-gray:hover{ background:#111827; }
    .btn-teal{ background:#0f766e; }
    .btn-teal:hover{ background:#115e59; }
    .btn-red{ background:#dc2626; }
    .btn-red:hover{ background:#b91c1c; }

    .hr{ margin:26px 0; border-top:1px solid #e5e7eb; }
    .hint{ color:#6b7280; font-size:13px; margin-top:6px; }

    table{ width:100%; border-collapse:collapse; margin-top:10px; }
    th, td{ border:1px solid #e5e7eb; padding:8px; }
    th{ background:#f9fafb; }

    .msgbox{
      margin-top:12px;
      white-space:pre-line;
      background:#0b1220;
      color:#e5e7eb;
      padding:14px;
      border-radius:12px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
  </style>
</head>

<body>
<div class="container">

<h1>Hoja de pesos y sebo</h1>

<label for="fecha">Fecha:</label>
<input type="date" id="fecha">

<div class="hr"></div>

<h2>Mensaje de pesajes (WhatsApp)</h2>

<div class="row">
  <div>
    <label>Origen / De quién se recibe</label>
    <input id="origen" placeholder="Ej. Rastro municipal / Mireles / Viaje">
  </div>
  <div>
    <label>Número WhatsApp (opcional)</label>
    <input id="whatsNumero" placeholder="Ej. 524621872594">
  </div>
</div>

<div class="row">
  <div>
    <label>Producto</label>
    <input id="prodNombre" placeholder="Ej. Panza sucia / Cabeza de res">
  </div>
  <div>
    <label>Kilos (opcional)</label>
    <input type="number" id="prodKg" step="0.01">
  </div>
  <div>
    <label>Piezas (opcional)</label>
    <input type="number" id="prodPzas">
  </div>
  <div style="flex:0 0 auto;">
    <button onclick="agregarLinea()">Agregar</button>
  </div>
</div>

<table>
<thead>
<tr>
  <th>Producto</th>
  <th>Kg</th>
  <th>Pzas</th>
  <th></th>
</tr>
</thead>
<tbody id="tablaLineas"></tbody>
</table>

<div class="row">
  <button class="btn-teal" onclick="generarMensaje()">Generar mensaje</button>
  <button onclick="copiarMensaje()">Copiar</button>
  <button class="btn-gray" onclick="abrirWhatsApp()">Abrir WhatsApp</button>
  <button class="btn-red" onclick="limpiarPesajes()">Limpiar</button>
</div>

<div id="vistaMensaje" class="msgbox" style="display:none;"></div>

</div>

<script>
let pesajes = [];

function fechaMX(){
  const v = document.getElementById('fecha').value;
  return v ? new Date(v+'T00:00:00').toLocaleDateString('es-MX') : new Date().toLocaleDateString('es-MX');
}

/* === AGREGAR LINEA (KG Y PZAS OPCIONALES) === */
function agregarLinea(){
  const producto = document.getElementById('prodNombre').value.trim();
  const kgRaw = document.getElementById('prodKg').value;
  const pzasRaw = document.getElementById('prodPzas').value;

  const kg = kgRaw === '' ? null : Number(kgRaw);
  const pzas = pzasRaw === '' ? null : Number(pzasRaw);

  if(!producto) return alert("Falta el producto");
  if((!kg || kg<=0) && (!pzas || pzas<=0))
    return alert("Debes ingresar kilos, piezas o ambos");

  pesajes.push({
    producto,
    kg: (kg && kg>0) ? kg : null,
    pzas: (pzas && pzas>0) ? parseInt(pzas) : null
  });

  document.getElementById('prodNombre').value='';
  document.getElementById('prodKg').value='';
  document.getElementById('prodPzas').value='';

  renderTabla();
}

function renderTabla(){
  const tb = document.getElementById('tablaLineas');
  tb.innerHTML='';
  pesajes.forEach((p,i)=>{
    tb.innerHTML += `
      <tr>
        <td>${p.producto}</td>
        <td>${p.kg ? p.kg.toFixed(2) : ''}</td>
        <td>${p.pzas ? p.pzas : ''}</td>
        <td><button class="btn-red" onclick="eliminarLinea(${i})">X</button></td>
      </tr>`;
  });
}

function eliminarLinea(i){
  pesajes.splice(i,1);
  renderTabla();
}

/* === MENSAJE === */
function generarMensaje(){
  const origen = document.getElementById('origen').value.trim();
  if(!origen) return alert("Falta el origen");
  if(pesajes.length===0) return alert("Agrega productos");

  let msg = `📦 *PESAJE RECIBIDO*\n`;
  msg += `📅 Fecha: ${fechaMX()}\n`;
  msg += `👤 Origen: ${origen}\n\n*Detalle:*\n`;

  pesajes.forEach(p=>{
    let l = `• ${p.producto} — `;
    if(p.kg && p.pzas) l += `${p.kg.toFixed(2)} kg | ${p.pzas} pzas`;
    else if(p.kg) l += `${p.kg.toFixed(2)} kg`;
    else if(p.pzas) l += `${p.pzas} pzas`;
    msg += l+'\n';
  });

  const box = document.getElementById('vistaMensaje');
  box.style.display='block';
  box.textContent = msg;
  return msg;
}

function copiarMensaje(){
  const msg = generarMensaje();
  if(msg) navigator.clipboard.writeText(msg);
}

function abrirWhatsApp(){
  const msg = generarMensaje();
  if(!msg) return;
  const num = document.getElementById('whatsNumero').value.trim();
  const url = num
    ? `https://wa.me/${num}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

function limpiarPesajes(){
  pesajes=[];
  document.getElementById('origen').value='';
  document.getElementById('whatsNumero').value='';
  document.getElementById('vistaMensaje').style.display='none';
  renderTabla();
}
</script>

</body>
</html>
