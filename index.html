<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoja de Viaje - VDC360°</title>

  <!-- Supabase v1 (como tu proyecto) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.6/dist/umd/supabase.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { text-align: center; }
    .section { border: 1px solid #ddd; padding: 10px; margin-bottom: 20px; border-radius:10px; background:#fff; }
    .section h2 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    input[type="number"] { width: 110px; padding:8px; }
    .btn { padding: 10px 14px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 10px; margin-top: 6px; font-weight:900; }
    .btn.secondary{ background:#0a7a3b; }
    .btn.danger{ background:#b91c1c; }
    .row2 { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .muted { color:#555; font-size:12px; }

    /* ====== NUEVO: estilos del marcador ====== */
    .mark-select{
      width: 140px;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #cfd3d8;
      background: #fff;
      font-weight: 800;
    }
    .row-mark-none { background: transparent; }
    .row-mark-yellow { background: rgba(255, 235, 59, .35); }
    .row-mark-blue { background: rgba(33, 150, 243, .20); }
    .row-mark-green { background: rgba(76, 175, 80, .20); }
    .row-mark-red { background: rgba(244, 67, 54, .18); }
    .row-mark-purple { background: rgba(156, 39, 176, .16); }

    /* ====== NUEVO: pill realtime ====== */
    .rt-pill{
      display:inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      background:#eef7ef;
      color:#1f6f26;
      border:1px solid rgba(0,0,0,.08);
      margin-left: 10px;
    }
    .rt-pill.off{
      background:#fff1f2;
      color:#b91c1c;
    }

    /* ===== Báscula box ===== */
    .bascula-box{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.10);
      background:#f7faf7;
    }
    .peso-big{
      font-size: 34px;
      font-weight: 1000;
      letter-spacing:.5px;
    }
    .peso-status{
      display:inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 1000;
      font-size: 12px;
      background:#eef7ef;
      color:#1f6f26;
      border:1px solid rgba(0,0,0,.08);
    }
    .peso-status.off{
      background:#fff1f2;
      color:#b91c1c;
    }

    /* ===== NUEVO: Barra flotante “Usar peso” ===== */
    .peso-floatbar{
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 99999;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .peso-float-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .peso-mini{
      font-weight: 1000;
      font-size: 18px;
    }
    .peso-help{
      font-size: 12px;
      color: #555;
    }

    /* Para que el contenido no quede tapado por la barra */
    body{ padding-bottom: 120px; }
  </style>
</head>

<body>
  <a href="https://marcianoper.github.io/vdc-central/"
     style="
       position:fixed;
       top:12px;
       left:12px;
       background:#0a7a3b;
       color:#fff;
       padding:10px 14px;
       border-radius:12px;
       text-decoration:none;
       font-weight:900;
       z-index:9999;
       box-shadow:0 10px 20px rgba(0,0,0,.15);
     ">
    ← VDC Central
  </a>

  <h1>
    Hoja de Viaje - VDC360°
    <span id="rt" class="rt-pill">REAL TIME</span>
  </h1>

  <div class="row2" style="margin: 10px 0 16px 0;">
    <label><strong>Fecha del viaje:</strong> <input type="date" id="fechaViaje"></label>
  </div>

  <!-- ===== BÁSCULA EN VIVO ===== -->
  <div class="section">
    <h2>Báscula en vivo</h2>

    <div class="bascula-box">
      <div>
        <strong>Peso actual:</strong>
        <span id="pesoLive" class="peso-big">--</span> kg
      </div>
      <span id="pesoStatus" class="peso-status">CONECTANDO</span>

      <button class="btn secondary" type="button" onclick="leerPesoManual()">Actualizar ahora</button>
    </div>

    <p class="muted" style="margin-top:8px;">
      Tip: haz click dentro de un input de <b>Kg</b> (una pesada) y luego presiona “Usar este peso”.
    </p>
  </div>

  <!-- ===== CONTENEDOR PRODUCTOS ===== -->
  <div id="contenedorProductos"></div>

  <button class="btn" onclick="guardarViaje()">Guardar Viaje</button>
  <button class="btn secondary" onclick="mostrarHistorial()">Ver Historial</button>
  <button class="btn secondary" onclick="generarResumenTotales()">Generar Documento de Totales</button>

  <div id="historialContainer" style="margin-top: 30px;"></div>

  <!-- ===== NUEVO: Barra flotante siempre visible ===== -->
  <div class="peso-floatbar">
    <div class="peso-float-left">
      <span class="peso-mini">Peso: <span id="pesoLiveMini">--</span> kg</span>
      <span id="pesoStatusMini" class="peso-status">CONECTANDO</span>
      <span class="peso-help">Selecciona un input de Kg y presiona el botón</span>
    </div>

    <button class="btn" type="button" onclick="tomarPesoEnInputActivo()">
      Usar este peso
    </button>
  </div>

  <script>
    /* ========= CLIENTE SUPABASE ========= */
    const supabase = window.supabase.createClient(
      'https://rcegikeiaxptolrduguc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZWdpa2VpYXhwdG9scmR1Z3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU2NTMyMDcsImV4cCI6MjA3MTIyOTIwN30.jbPM9F977zeITEmFA_xvVU6SCxlWWVCi3Dx7ZhFfTp8'
    );

    /* ========= TABLA LIVE DE BÁSCULA ========= */
    // Debe existir en esta misma supabase (igual que tu bascula_live de otros proyectos)
    // Estructura típica:
    // id (text pk) | peso (numeric) | updated_at (timestamptz)
    const BASCULA_TABLE = 'bascula_live';
    const BASCULA_ID = 'torrey_1';

    /* ========= REALTIME LIVE TABLE (estado hoja) ========= */
    const LIVE_TABLE = 'hoja_viaje_live';

    /* ========= DEVICE ID ========= */
    const DEVICE_ID = (() => {
      const k = 'vdc_device_id';
      let v = localStorage.getItem(k);
      if(!v){
        v = 'dev_' + Math.random().toString(16).slice(2) + '_' + Date.now();
        localStorage.setItem(k, v);
      }
      return v;
    })();

    /* ========= LISTA DE PRODUCTOS ========= */
    const productos = ['Cabeza de res', 'Tripa de res', 'Menudo sucio', 'Cuajo de res', 'Pata sucia', 'Hígado', 'Libro de res', 'Teleco', 'Corazón'];

    function $(s){ return document.querySelector(s); }

    function todayISO(){
      const d = new Date();
      const z = d.getTimezoneOffset() * 60000;
      return new Date(d - z).toISOString().slice(0,10);
    }

    function getID(producto) {
      return producto.toLowerCase().replace(/\s+/g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    /* ========= marcador por fila ========= */
    const MARKS = [
      { key: 'none',   label: 'Sin marca',   cls: 'row-mark-none' },
      { key: 'yellow', label: 'Cliente A',   cls: 'row-mark-yellow' },
      { key: 'blue',   label: 'Cliente B',   cls: 'row-mark-blue' },
      { key: 'green',  label: 'Cliente C',   cls: 'row-mark-green' },
      { key: 'red',    label: 'Urgente',     cls: 'row-mark-red' },
      { key: 'purple', label: 'Especial',    cls: 'row-mark-purple' },
    ];

    function markToClass(markKey){
      const f = MARKS.find(m => m.key === markKey);
      return (f ? f.cls : 'row-mark-none');
    }

    function buildMarkSelect(selectedKey = 'none'){
      const sel = document.createElement('select');
      sel.className = 'mark-select';
      sel.innerHTML = MARKS.map(m => `<option value="${m.key}" ${m.key===selectedKey?'selected':''}>${m.label}</option>`).join('');
      return sel;
    }

    function applyRowMark(row, markKey){
      MARKS.forEach(m => row.classList.remove(m.cls));
      row.classList.add(markToClass(markKey));
      row.dataset.mark = markKey || 'none';
    }

    function crearTabla(producto) {
      const id = getID(producto);
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h2>${producto}</h2>
        <table id="tabla-${id}">
          <thead>
            <tr>
              <th>Kg</th>
              <th>Piezas</th>
              <th>Marcador</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button class="btn agregar-btn" data-producto="${producto}">Agregar Pesada</button>
        <p><strong>Total Kg:</strong> <span id="totalKg-${id}">0</span> |
           <strong>Total Pzas:</strong> <span id="totalPzas-${id}">0</span></p>`;
      document.getElementById('contenedorProductos').appendChild(section);
    }

    /* ========= FILAS Y TOTALES ========= */
    function agregarFila(producto, kgValue = '', pzasValue = '', markKey = 'none') {
      const id = getID(producto);
      const tabla = document.querySelector(`#tabla-${id} tbody`);
      const fila = document.createElement('tr');

      const markSelect = buildMarkSelect(markKey);
      markSelect.addEventListener('change', () => {
        applyRowMark(fila, markSelect.value);
        actualizarTotales(producto);
        scheduleSaves();
      });

      fila.innerHTML = `
        <td><input class="kg-input" type="number" step="0.1" value="${kgValue}"
              onchange="actualizarTotales('${producto}'); scheduleSaves();"></td>
        <td><input type="number" value="${pzasValue}"
              onchange="actualizarTotales('${producto}'); scheduleSaves();"></td>
        <td class="mark-cell"></td>
        <td><button class="btn danger" onclick="eliminarFila(this)">Eliminar</button></td>`;

      fila.querySelector('.mark-cell').appendChild(markSelect);
      tabla.appendChild(fila);

      applyRowMark(fila, markKey || 'none');

      actualizarTotales(producto);
      scheduleSaves();
    }

    function eliminarFila(btn) {
      const row = btn.parentNode.parentNode;
      const producto = row.closest('.section').querySelector('h2').textContent;
      row.remove();
      actualizarTotales(producto);
      scheduleSaves();
    }

    function actualizarTotales(producto) {
      const id = getID(producto);
      const filas = document.querySelectorAll(`#tabla-${id} tbody tr`);
      let totalKg = 0;
      let totalPzas = 0;
      filas.forEach(row => {
        const kg = parseFloat(row.children[0].children[0].value) || 0;
        const pzas = parseFloat(row.children[1].children[0].value) || 0;
        totalKg += kg;
        totalPzas += pzas;
      });
      document.getElementById(`totalKg-${id}`).textContent = totalKg.toFixed(1);
      document.getElementById(`totalPzas-${id}`).textContent = totalPzas;
    }

    /* ========= GUARDAR / HISTORIAL / RESUMEN ========= */
    function recolectarResultados(){
      const resultados = {};
      productos.forEach(producto => {
        const id = getID(producto);
        const filas = document.querySelectorAll(`#tabla-${id} tbody tr`);
        resultados[producto] = [];
        filas.forEach(row => {
          const kg = parseFloat(row.children[0].children[0].value) || 0;
          const pzas = parseFloat(row.children[1].children[0].value) || 0;
          const mark = row.dataset.mark || 'none';
          if (kg || pzas) resultados[producto].push({ kg, pzas, mark });
        });
      });
      return resultados;
    }

    async function guardarViaje() {
      const fecha = document.getElementById('fechaViaje').value;
      if (!fecha) return alert("⚠️ Por favor selecciona una fecha.");

      const resultados = recolectarResultados();

      const { data, error } = await supabase
        .from('hoja_viaje')
        .insert([{ fecha, resultados }])
        .select()
        .single();

      if (error) {
        alert("❌ Error al guardar: " + error.message);
      } else {
        alert("✅ Viaje guardado correctamente.");
        if (data && data.id) {
          window.viaje_id = data.id;
          await saveLive();
          saveLocal();
        }
      }
    }

    async function mostrarHistorial() {
      const { data, error } = await supabase.from('hoja_viaje').select('*').order('fecha', { ascending: false });
      const contenedor = document.getElementById('historialContainer');
      contenedor.innerHTML = '';

      if (error) {
        contenedor.innerHTML = '<p style="color:red;">❌ Error al cargar historial: ' + error.message + '</p>';
        return;
      }

      if (!data || data.length === 0) {
        contenedor.innerHTML = '<p>No hay viajes registrados.</p>';
        return;
      }

      const tabla = document.createElement('table');
      tabla.style.width = '100%';
      tabla.border = 1;
      tabla.innerHTML = '<thead><tr><th>Fecha</th><th>Resumen</th></tr></thead><tbody>' +
        data.map(row => `<tr><td>${row.fecha}</td><td><pre>${JSON.stringify(row.resultados, null, 2)}</pre></td></tr>`).join('') +
        '</tbody>';
      contenedor.appendChild(tabla);
    }

    async function generarResumenTotales() {
      const { data, error } = await supabase.from('hoja_viaje').select('*');
      if (error || !data) return alert('❌ Error al obtener datos: ' + error.message);

      const totales = {};
      data.forEach(row => {
        const prods = row.resultados || {};
        Object.keys(prods).forEach(nombre => {
          prods[nombre].forEach(r => {
            if (!totales[nombre]) totales[nombre] = { kg: 0, pzas: 0 };
            totales[nombre].kg += r.kg || 0;
            totales[nombre].pzas += r.pzas || 0;
          });
        });
      });

      let html = '<h1>Resumen Total de Kilos y Piezas</h1>';
      html += '<table border="1" cellpadding="6"><tr><th>Producto</th><th>Total Kg</th><th>Total Pzas</th></tr>';
      Object.entries(totales).forEach(([nombre, valores]) => {
        html += `<tr><td>${nombre}</td><td>${valores.kg.toFixed(1)}</td><td>${valores.pzas}</td></tr>`;
      });
      html += '</table>';

      const blob = new Blob([`<html><body>${html}</body></html>`], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    /* ========= LIVE (estado hoja) ========= */
    const MODULE = 'hoja_viaje';
    let dirty=false, tLocal=null, tLive=null;
    let rtSub = null;
    let applyingRemote = false;

    function getFechaISO(){ return document.getElementById('fechaViaje')?.value || todayISO(); }
    function liveKey(){ return `viaje-${getFechaISO()}`; }
    function collectState(){ return { fecha: getFechaISO(), resultados: recolectarResultados() }; }

    function aplicarResultados(resultados){
      if(!resultados) return;
      productos.forEach(producto => {
        const id = getID(producto);
        const tbody = document.querySelector(`#tabla-${id} tbody`);
        tbody.innerHTML = '';
        const rows = resultados[producto] || [];
        rows.forEach(r => agregarFila(producto, r.kg || '', r.pzas || '', r.mark || 'none'));
        if(rows.length === 0) { actualizarTotales(producto); }
      });
    }

    function applyState(state){
      if(!state) return;
      if(state.fecha){ document.getElementById('fechaViaje').value = state.fecha; }
      aplicarResultados(state.resultados || {});
    }

    // LocalStorage
    function lkey(){ return `draft:${MODULE}:${liveKey()}`; }
    function saveLocal(){
      localStorage.setItem(lkey(), JSON.stringify({ts:Date.now(), data:collectState()}));
      dirty=true;
    }
    function loadLocal(){
      const raw=localStorage.getItem(lkey());
      if(!raw) return;
      try{ applyState(JSON.parse(raw).data); }catch{}
    }

    async function saveLive(){
      if(applyingRemote) return;

      const state = collectState();
      const row = {
        id: liveKey(),
        fecha: state.fecha,
        data: state,
        updated_at: new Date().toISOString(),
        updated_by: DEVICE_ID
      };

      const { error } = await supabase
        .from(LIVE_TABLE)
        .upsert([row], { onConflict: 'id' });

      if(error){
        console.log("LIVE UPSERT ERROR:", error);
        setRtPill(false, 'RT OFF');
      }else{
        setRtPill(true, 'REAL TIME');
      }
    }

    async function loadLive(){
      const { data, error } = await supabase
        .from(LIVE_TABLE)
        .select('data, updated_by, updated_at')
        .eq('id', liveKey())
        .single();
      if(error) return;
      if(data && data.data){
        applyingRemote = true;
        applyState(data.data);
        applyingRemote = false;
      }
    }

    function setRtPill(on, text){
      const pill = $('#rt');
      if(!pill) return;
      pill.textContent = text || (on ? 'REAL TIME' : 'RT OFF');
      pill.classList.toggle('off', !on);
    }

    function subscribeLive(){
      if(rtSub){
        try{ supabase.removeSubscription(rtSub); }catch(e){}
        rtSub = null;
      }

      rtSub = supabase
        .from(`${LIVE_TABLE}:id=eq.${liveKey()}`)
        .on('INSERT', payload => onLivePayload(payload))
        .on('UPDATE', payload => onLivePayload(payload))
        .subscribe((status)=>{
          if(status === 'SUBSCRIBED') setRtPill(true, 'REAL TIME');
        });
    }

    function onLivePayload(payload){
      try{
        const row = payload.new || payload.record || null;
        if(!row) return;
        if(row.updated_by && row.updated_by === DEVICE_ID) return;

        if(row.data){
          applyingRemote = true;
          applyState(row.data);
          applyingRemote = false;
          dirty = true;
        }
      }catch(e){
        console.log("LIVE PAYLOAD ERROR:", e);
      }
    }

    function scheduleSaves(){
      clearTimeout(tLocal);
      tLocal=setTimeout(saveLocal, 400);

      clearTimeout(tLive);
      tLive=setTimeout(saveLive, 700);
    }

    document.addEventListener('input', (e)=>{
      if (e.target.matches('input,select,textarea')) scheduleSaves();
    });

    window.addEventListener('beforeunload', (e)=>{
      if(!dirty) return;
      e.preventDefault();
      e.returnValue='';
    });

    document.getElementById('fechaViaje')?.addEventListener('change', async ()=>{
      applyingRemote = true;
      await loadLive();
      loadLocal();
      applyingRemote = false;
      subscribeLive();
    });

    /* ========= BÁSCULA EN VIVO (como tus otros proyectos) ========= */
    let pesoActual = null;
    let pesoSub = null;
    let lastFocusedKgInput = null;

    // Detectar el último input de kg seleccionado (focus)
    document.addEventListener('focusin', (e)=>{
      const el = e.target;
      if(el && el.classList && el.classList.contains('kg-input')){
        lastFocusedKgInput = el;
      }
    });

    function setPesoUI(p){
      const v = (Number(p)||0);
      const el = $('#pesoLive');
      if(el) el.textContent = v.toFixed(2);
      const mini = $('#pesoLiveMini');
      if(mini) mini.textContent = v.toFixed(2);
      pesoActual = v;
    }

    function setPesoStatus(on, text){
      const t = text || (on ? 'OK' : 'OFF');

      const pill = $('#pesoStatus');
      if(pill){
        pill.textContent = t;
        pill.classList.toggle('off', !on);
      }

      const pill2 = $('#pesoStatusMini');
      if(pill2){
        pill2.textContent = t;
        pill2.classList.toggle('off', !on);
      }
    }

    async function leerPesoManual(){
      const { data, error } = await supabase
        .from(BASCULA_TABLE)
        .select('peso, updated_at')
        .eq('id', BASCULA_ID)
        .single();

      if(error){
        console.log("BASCULA READ ERROR:", error);
        setPesoStatus(false, 'OFF');
        alert("Error leyendo Supabase (bascula_live). Revisa internet / RLS / tabla.");
        return;
      }

      setPesoUI(data?.peso ?? 0);
      setPesoStatus(true, 'OK');
    }

    function tomarPesoEnInputActivo(){
      if(pesoActual == null){
        alert("Aún no hay peso. Presiona 'Actualizar ahora' o espera el realtime.");
        return;
      }

      const target = lastFocusedKgInput || document.querySelector('.kg-input:focus');
      if(!target){
        alert("Primero haz click en un input de Kg (una pesada) y luego presiona 'Usar este peso'.");
        return;
      }

      target.value = Number(pesoActual).toFixed(2);
      target.dispatchEvent(new Event('input', { bubbles:true }));
      target.dispatchEvent(new Event('change', { bubbles:true }));
      // Totales y guardado
      const producto = target.closest('.section')?.querySelector('h2')?.textContent;
      if(producto) actualizarTotales(producto);
      scheduleSaves();
    }

    function subscribeBascula(){
      // v1 realtime
      if(pesoSub){
        try{ supabase.removeSubscription(pesoSub); }catch(e){}
        pesoSub = null;
      }

      pesoSub = supabase
        .from(`${BASCULA_TABLE}:id=eq.${BASCULA_ID}`)
        .on('UPDATE', payload => {
          const row = payload.new || payload.record;
          if(row && row.peso != null){
            setPesoUI(row.peso);
            setPesoStatus(true, 'OK');
          }
        })
        .on('INSERT', payload => {
          const row = payload.new || payload.record;
          if(row && row.peso != null){
            setPesoUI(row.peso);
            setPesoStatus(true, 'OK');
          }
        })
        .subscribe((status)=>{
          if(status === 'SUBSCRIBED'){
            setPesoStatus(true, 'OK');
          }
        });
    }

    /* ========= ARRANQUE ========= */
    document.addEventListener('DOMContentLoaded', async () => {
      // tablas productos
      productos.forEach(crearTabla);

      document.addEventListener('click', function(e) {
        if (e.target.classList.contains('agregar-btn')) {
          const producto = e.target.getAttribute('data-producto');
          agregarFila(producto);
        }
      });

      // Fecha hoy por defecto
      document.getElementById('fechaViaje').value = todayISO();

      // 1) cargar LIVE primero, 2) luego local
      await loadLive();
      loadLocal();

      // 3) suscribir realtime hoja
      subscribeLive();

      // 4) crear sala si no existe
      await saveLive();

      // 5) bascula: leer una vez y suscribir realtime
      setPesoStatus(true, 'CONECTANDO');
      await leerPesoManual();
      subscribeBascula();
    });
  </script>
</body>
</html>
