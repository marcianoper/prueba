<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte 80mm</title>

<style>

/* ===== Vista normal ===== */
body{
  font-family: system-ui, Segoe UI, Roboto, Arial;
  padding:20px;
}

button{
  padding:8px 14px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:15px;
}

/* ===== IMPRESIÓN 80mm ===== */
@media print{

  @page{
    size: 80mm auto;
    margin: 0;
  }

  html,body{
    margin:0;
    padding:0;
    background:#fff;
  }

  body *{
    visibility:hidden;
  }

  #ticket, #ticket *{
    visibility:visible;
  }

  #ticket{
    position:fixed;
    left:0;
    top:0;
    width:80mm;
    padding:3mm 2.5mm;
    font-family:"Courier New", monospace;
    font-size:10px;
    line-height:1.25;
    color:#000;
  }

  .title{
    text-align:center;
    font-weight:700;
    font-size:12px;
    margin-bottom:6px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }

  thead th{
    border-bottom:1px solid #000;
    text-align:left;
    padding:2px;
    font-weight:700;
  }

  tbody td{
    border-bottom:1px solid rgba(0,0,0,.4);
    padding:2px;
    vertical-align:top;
  }

  .right{
    text-align:right;
  }

  .clip{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    display:block;
    width:100%;
  }

  tbody tr:nth-child(even){
    background:rgba(0,0,0,.05);
  }

}

</style>
</head>

<body>

<button onclick="window.print()">🖨 Imprimir 80mm</button>

<div id="ticket">

  <div class="title">Reporte de Interacciones</div>

  <table>
    <thead>
      <tr>
        <th style="width:26mm;">Fecha</th>
        <th style="width:18mm;">Nombre</th>
        <th class="right" style="width:20mm;">Teléfono</th>
        <th class="right" style="width:16mm;">Canal</th>
      </tr>
    </thead>
    <tbody id="tablaDatos">

      <!-- EJEMPLOS (BORRA Y PEGA LOS TUYOS) -->
      <tr>
        <td><span class="clip">2026-02-16 08:30</span></td>
        <td><span class="clip">Samuel</span></td>
        <td class="right"><span class="clip">5212731133390</span></td>
        <td class="right"><span class="clip">WhatsApp</span></td>
      </tr>

      <tr>
        <td><span class="clip">2026-02-16 08:49</span></td>
        <td><span class="clip">Carlos</span></td>
        <td class="right"><span class="clip">5214778457783</span></td>
        <td class="right"><span class="clip">Instagram</span></td>
      </tr>

    </tbody>
  </table>

  <div style="text-align:center;margin-top:6px;font-size:9px;">
    Carnes y Vísceras del Centro
  </div>

</div>

</body>
</html>
