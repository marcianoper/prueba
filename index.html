<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hoja de pesos y sebo</title>

  <!-- Supabase UMD (no módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    body { font-family: sans-serif; background: #f2f2f2; padding: 30px; }
    .container { background: white; padding: 40px; border-radius: 10px; max-width: 900px; margin: auto; }
    h1 { color: #000; font-size: 28px; margin: 0 0 10px; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    input, textarea {
      padding: 10px; font-size: 16px; margin-top: 5px;
      border: 1px solid #d1d5db; border-radius: 8px; width: 100%;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 12px;
      padding: 12px 18px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background-color: #146c43; }
    .btn-secondary{ background:#0f766e; }
    .btn-secondary:hover{ background:#115e59; }
    .btn-gray{ background:#374151; }
    .btn-gray:hover{ background:#111827; }

    #resultado-totales { margin-top: 30px; white-space: pre-line; font-size: 16px; background:#f9fafb; padding:14px; border-radius:10px; border:1px solid #e5e7eb; }

    .row-inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 20px; }
    .row-inline > div { flex: 1 1 220px; }
    .row-inline label { margin-top: 0; }

    .hr { margin: 26px 0; border-top: 1px solid #e5e7eb; }
    .hint{ color:#6b7280; font-size: 13px; margin-top:6px; }
    .pill {
      display:inline-block; background:#eef2ff; color:#3730a3;
      padding:4px 10px; border-radius:999px; font-size:12px; margin-left:8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hoja de pesos y sebo <span class="pill">+ Etiquetas 80mm</span></h1>

    <label for="fecha">Fecha del viaje:</label>
    <input type="date" id="fecha" />

    <div style="margin-top: 20px; display:flex; gap:10px; flex-wrap:wrap;">
      <button onclick="guardarViaje()">Guardar Viaje</button>
      <button class="btn-gray" onclick="generarDocumento()">Generar Documento de Totales</button>
    </div>

    <!-- === PAPEL DE SEBO === -->
    <div class="row-inline">
      <div>
        <label for="seboKg">Kilos de sebo (DIO SEBO):</label>
        <input type="number" id="seboKg" step="0.01" min="0" placeholder="Ej. 15.00" />
      </div>
      <div style="flex:0 0 auto;">
        <button onclick="imprimirSebo80mm()">Imprimir papel de sebo 80mm</button>
      </div>
    </div>

    <div class="hr"></div>

    <!-- === ETIQUETA LIBRE 80MM === -->
    <h2 style="margin:0 0 6px;">Etiqueta libre 80mm</h2>
    <div class="hint">
      Escribe lo que quieras imprimir. Respeta saltos de línea. Puedes incluir “Caja Washington / 890 kg / 40 cajas”, etc.
    </div>

    <label for="etiquetaTexto">Texto de etiqueta:</label>
    <textarea id="etiquetaTexto" placeholder="Ej:
CAJA WASHINGTON
890 kg
40 cajas
(Señalar)"></textarea>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-secondary" onclick="imprimirEtiqueta80mm()">Imprimir etiqueta 80mm</button>
      <button class="btn-gray" onclick="limpiarEtiqueta()">Limpiar</button>
    </div>

    <div class="row-inline" style="margin-top:16px;">
      <div>
        <label for="etqTitulo">Título (opcional):</label>
        <input id="etqTitulo" placeholder="Ej. ETIQUETA / SEÑALAMIENTO / INVENTARIO" />
        <div class="hint">Si lo dejas vacío, no imprime título.</div>
      </div>
      <div>
        <label for="etqCopias">Copias:</label>
        <input type="number" id="etqCopias" min="1" step="1" value="1" />
        <div class="hint">Imprime N copias del mismo texto.</div>
      </div>
    </div>

    <div class="row-inline">
      <div>
        <label for="etqProducto">Producto (rápido):</label>
        <input id="etqProducto" placeholder="Ej. Caja Washington" />
      </div>
      <div>
        <label for="etqKg">Kg (rápido):</label>
        <input type="number" id="etqKg" step="0.01" min="0" placeholder="Ej. 890" />
      </div>
      <div>
        <label for="etqCajas">Cajas/Pzas (rápido):</label>
        <input type="number" id="etqCajas" step="1" min="0" placeholder="Ej. 40" />
      </div>
      <div style="flex:0 0 auto;">
        <button onclick="armarEtiquetaRapida()">Armar texto</button>
      </div>
    </div>

    <div id="resultado-totales"></div>
  </div>

  <script>
    // ===== 1. Conectar Supabase (modo no-módulo) =====
    const supabaseUrl = 'https://rcegikeiaxptolrduguc.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZWdpa2VpYXhwdG9scmR1Z3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU2NTMyMDcsImV4cCI6MjA3MTIyOTIwN30.jbPM9F977zeITEmFA_xvVU6SCxlWWVCi3Dx7ZhFfTp8';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ===== Helper: fecha MX (usa fecha del viaje o hoy) =====
    function getFechaMXFromInput() {
      const fechaInput = document.getElementById('fecha');
      if (fechaInput && fechaInput.value) {
        const d = new Date(fechaInput.value + 'T00:00:00');
        return d.toLocaleDateString('es-MX');
      }
      return new Date().toLocaleDateString('es-MX');
    }

    // ===== 2. Guardar viaje (inserta json en hoja_viaje) =====
    async function guardarViaje() {
      const fecha = document.getElementById('fecha').value;

      if (!fecha) {
        alert("Selecciona la fecha del viaje");
        return;
      }

      // Datos de ejemplo – aquí después meteremos lo real
      const datos = {
        "Teleco": [
          { kg: 15.8, pzas: 14 },
          { kg: 108.5, pzas: 100 }
        ],
        "Cuajo": [
          { kg: 40.2, pzas: 40 }
        ]
      };

      const { error } = await supabase
        .from('hoja_viaje')
        .insert([{ fecha: fecha, resultados: datos }]);

      if (error) {
        console.error(error);
        alert("❌ Error al guardar viaje: " + error.message);
      } else {
        alert("✅ Viaje guardado correctamente.");
      }
    }

    // ===== 3. Generar documento de totales =====
    async function generarDocumento() {
      const fecha = document.getElementById('fecha').value;
      const resultadoDiv = document.getElementById('resultado-totales');
      resultadoDiv.textContent = "⏳ Cargando totales...";

      if (!fecha) {
        alert("Selecciona la fecha del viaje");
        resultadoDiv.textContent = "";
        return;
      }

      const { data, error } = await supabase
        .from('hoja_viaje')
        .select('resultados')
        .eq('fecha', fecha);

      if (error) {
        console.error(error);
        resultadoDiv.textContent = "❌ Error al leer datos: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        resultadoDiv.textContent = "❌ No se encontraron registros para esa fecha.";
        return;
      }

      let totales = {};

      data.forEach(entry => {
        const res = entry.resultados || {};
        Object.keys(res).forEach(prod => {
          res[prod].forEach(p => {
            if (!totales[prod]) totales[prod] = { kg: 0, pzas: 0 };
            totales[prod].kg += Number(p.kg) || 0;
            totales[prod].pzas += Number(p.pzas) || 0;
          });
        });
      });

      let docText = `📄 TOTALES DEL DÍA ${fecha}\n\n`;
      Object.entries(totales).forEach(([prod, datos]) => {
        docText += `🟢 ${prod} → ${datos.kg.toFixed(2)} kg | ${datos.pzas} piezas\n`;
      });

      resultadoDiv.textContent = docText;
    }

    // ===== Base: imprimir HTML 80mm =====
    function print80mm(html, copies = 1) {
      const win = window.open('', '_blank', 'width=420,height=650');
      if (!win) {
        alert("No se pudo abrir la ventana de impresión (bloqueador de popups).");
        return;
      }
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.focus();

      // Para copias: imprimimos, cerramos y reabrimos (lo más estable en navegador)
      let count = 1;
      const doPrint = () => {
        win.focus();
        win.print();
        count++;
        if (count <= copies) {
          // reintento de impresión con un pequeño delay
          setTimeout(doPrint, 450);
        } else {
          setTimeout(() => { try { win.close(); } catch(e){} }, 600);
        }
      };
      setTimeout(doPrint, 350);
    }

    // ===== 4. Ticket de sebo 80mm =====
    function imprimirSebo80mm() {
      const kg = Number(document.getElementById('seboKg').value || 0);
      if (!kg || kg <= 0) {
        alert("Ingresa los kilos de sebo.");
        return;
      }

      const fecha = getFechaMXFromInput();
      const STORE_NAME = "Carnes y Vísceras del Centro";

      const html = `
      <!DOCTYPE html><html lang="es"><head>
        <meta charset="utf-8" />
        <title>Papel de Sebo 80mm</title>
        <style>
          *{box-sizing:border-box}
          body{margin:0;background:#fff;color:#111;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;}
          #ticket{padding:2mm;width:80mm}
          h3{margin:0 0 4px;text-align:center;font-size:14px}
          .meta{font-size:11px;text-align:center;margin-bottom:6px}
          .line{border-top:1px dashed #000;margin:6px 0}
          .big{text-align:center;font-weight:700;font-size:16px;margin:6px 0}
          .amount{text-align:center;font-size:20px;font-weight:800;margin:4px 0}
          .firma{margin-top:12px;font-size:11px}
          .footer{margin-top:10px;font-size:11px;text-align:center}
          @media print{@page{size:80mm auto;margin:0} body{margin:0} }
        </style>
      </head><body>
        <div id="ticket">
          <h3>${STORE_NAME}</h3>
          <div class="meta">PAPEL DE SEBO<br>FECHA: ${fecha}</div>
          <div class="line"></div>
          <div class="big">DIO SEBO</div>
          <div class="amount">${kg.toFixed(2)} KG</div>
          <div class="line"></div>
          <div class="firma">FIRMA: ____________________________</div>
          <div class="footer">Gracias por su entrega</div>
        </div>
      </body></html>`;
      print80mm(html, 1);
    }

    // ===== 5. ETIQUETA LIBRE 80mm =====
    function imprimirEtiqueta80mm() {
      const texto = (document.getElementById('etiquetaTexto').value || '').trim();
      if (!texto) {
        alert("Escribe el texto de la etiqueta.");
        return;
      }

      const titulo = (document.getElementById('etqTitulo').value || '').trim();
      const copias = Math.max(1, parseInt(document.getElementById('etqCopias').value || '1', 10));

      const fecha = getFechaMXFromInput();
      const STORE_NAME = "Carnes y Vísceras del Centro";

      // Escapa HTML y respeta saltos de línea
      const escapeHtml = (s) => s
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");

      const safe = escapeHtml(texto).replaceAll('\n','<br>');

      const html = `
      <!DOCTYPE html><html lang="es"><head>
        <meta charset="utf-8" />
        <title>Etiqueta 80mm</title>
        <style>
          *{box-sizing:border-box}
          body{margin:0;background:#fff;color:#111;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;}
          #ticket{padding:2mm;width:80mm}
          .top{display:flex;justify-content:space-between;gap:8px;font-size:10px}
          .store{font-weight:700}
          .title{margin:6px 0 6px;text-align:center;font-size:13px;font-weight:800}
          .line{border-top:1px dashed #000;margin:6px 0}
          .body{font-size:16px;font-weight:800;line-height:1.15; text-align:center; word-break:break-word}
          .footer{margin-top:10px;font-size:10px;text-align:center}
          @media print{@page{size:80mm auto;margin:0} body{margin:0} }
        </style>
      </head><body>
        <div id="ticket">
          <div class="top">
            <div class="store">${STORE_NAME}</div>
            <div>${fecha}</div>
          </div>
          ${titulo ? `<div class="title">${escapeHtml(titulo)}</div>` : `<div class="line"></div>`}
          <div class="body">${safe}</div>
          <div class="line"></div>
          <div class="footer">Etiqueta / Señalamiento</div>
        </div>
      </body></html>`;
      print80mm(html, copias);
    }

    function limpiarEtiqueta(){
      document.getElementById('etiquetaTexto').value = '';
      document.getElementById('etqTitulo').value = '';
      document.getElementById('etqCopias').value = 1;
      document.getElementById('etqProducto').value = '';
      document.getElementById('etqKg').value = '';
      document.getElementById('etqCajas').value = '';
    }

    function armarEtiquetaRapida(){
      const prod = (document.getElementById('etqProducto').value || '').trim();
      const kg = Number(document.getElementById('etqKg').value || 0);
      const cajas = Number(document.getElementById('etqCajas').value || 0);

      if (!prod) { alert("Pon el producto (Ej. Caja Washington)."); return; }

      let lines = [prod.toUpperCase()];
      if (kg > 0) lines.push(`${kg.toFixed(2)} kg`);
      if (cajas > 0) lines.push(`${parseInt(cajas,10)} cajas`);
      document.getElementById('etiquetaTexto').value = lines.join('\n');
    }

    // Exponer funciones
    window.guardarViaje = guardarViaje;
    window.generarDocumento = generarDocumento;
    window.imprimirSebo80mm = imprimirSebo80mm;
    window.imprimirEtiqueta80mm = imprimirEtiqueta80mm;
    window.limpiarEtiqueta = limpiarEtiqueta;
    window.armarEtiquetaRapida = armarEtiquetaRapida;
  </script>
</body>
</html>
