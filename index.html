<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VDC360° — Notas a Crédito</title>

  <style>
    :root{--ink:#111;--brand:#0a7a3b;--muted:#6b7280;--bg:#f6f7f8;--card:#fff;--danger:#b91c1c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto}
    header{background:var(--brand);color:#fff;padding:14px 18px}
    header h1{margin:0;font-size:18px}
    main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
    .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    label{font-weight:800;font-size:13px;color:#111}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:12px;font-size:14px}
    button{border:none;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}
    .btn{background:var(--brand);color:#fff}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn-outline{background:#fff;border:1px solid #e5e7eb}
    .mini{padding:10px 12px;border-radius:10px}
    .muted{color:var(--muted);font-weight:700}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:#f3f4f6;font-weight:800}
    .ok{color:var(--brand)}
    .bad{color:var(--danger)}
  </style>
</head>

<body>
  <header>
    <h1>VDC360° — Notas a Crédito</h1>
  </header>

  <main>
    <section class="card">
      <div class="row">
        <div>
          <label>Producto</label>
          <input id="pProducto" placeholder="Ej. Panza, Tripa, Teleco..." />
        </div>

        <div>
          <label>Kilos</label>
          <input id="pKg" type="number" min="0" step="0.01" value="0" />

          <!-- ✅ NUEVO: botón para tomar peso -->
          <div class="actions" style="margin-top:10px">
            <button type="button" id="btnPeso" class="btn mini">📥 Tomar peso</button>
            <span id="pesoStatus" class="badge muted">Báscula: esperando…</span>
          </div>
        </div>

        <div>
          <label>Piezas (opcional)</label>
          <input id="pPzas" type="number" min="0" step="1" value="0" />
        </div>
      </div>

      <div style="margin-top:14px" class="actions">
        <button class="btn" type="button" id="btnAgregar">Agregar</button>
        <button class="btn-outline" type="button" id="btnLimpiar">Limpiar</button>
      </div>

      <p class="muted" style="margin-top:12px">
        Tip: Deja abierto <b>Viewer 3.0</b> en la PC. Con un clic en “Tomar peso” se llena el campo de Kg.
      </p>
    </section>

    <!-- Aquí iría tu tabla / lista / lógica de nota a crédito (no la toqué) -->
    <section class="card">
      <b>Área de tu nota / tabla / impresión…</b>
      <div class="muted">Aquí va tu contenido actual (no modificado).</div>
    </section>
  </main>

  <script>
    // =========================
    // ✅ LECTURA AUTOMÁTICA DE BÁSCULA (MISMA PC WINDOWS)
    // =========================
    const BASCULA_URL = "http://127.0.0.1:8765/peso"; // MISMA PC

    const btnPeso = document.getElementById("btnPeso");
    const pesoStatus = document.getElementById("pesoStatus");

    // ✅ input real de kilos
    const kgInputSelector = "#pKg";

    function setStatus(msg, ok=true){
      if(!pesoStatus) return;
      pesoStatus.textContent = msg || "";
      pesoStatus.classList.remove("ok","bad");
      pesoStatus.classList.add(ok ? "ok" : "bad");
    }

    function setKgValue(value){
      const el = document.querySelector(kgInputSelector);
      if(!el) {
        alert("No encontré el input de Kg (#pKg).");
        return;
      }
      el.value = value;

      // Disparar eventos para que tu sistema recalculen totales
      el.dispatchEvent(new Event("input", { bubbles:true }));
      el.dispatchEvent(new Event("change", { bubbles:true }));
    }

    async function tomarPeso(){
      setStatus("Báscula: leyendo…", true);
      btnPeso.disabled = true;

      try{
        const res = await fetch(BASCULA_URL, { cache:"no-store" });
        const data = await res.json();

        let peso = null;
        if (typeof data.peso === "number") peso = data.peso;
        else if (typeof data.last_ok === "number") peso = data.last_ok;

        if (peso === null){
          setStatus("Báscula: no se pudo leer.", false);
          alert("No se pudo leer el peso. ¿Está abierto Viewer 3.0?");
          return;
        }

        // Si viene negativo por TARE, guardamos positivo
        const kg = Math.abs(peso);

        setKgValue(kg.toFixed(2));
        setStatus(`Báscula: OK ${kg.toFixed(2)} kg (${data.metodo})`, true);

      } catch(err){
        console.error(err);
        setStatus("Báscula: error de conexión.", false);
        alert("Error conectando con el servidor de la báscula. Revisa que bascula_server.py esté corriendo.");
      } finally {
        btnPeso.disabled = false;
      }
    }

    if(btnPeso) btnPeso.addEventListener("click", tomarPeso);

    // =========================
    // (TU LÓGICA EXISTENTE - EJEMPLO MINIMO)
    // =========================
    const btnAgregar = document.getElementById("btnAgregar");
    const btnLimpiar = document.getElementById("btnLimpiar");

    btnAgregar?.addEventListener("click", () => {
      const prod = document.getElementById("pProducto").value.trim();
      const kg = Number(document.getElementById("pKg").value || 0);
      const pzas = Number(document.getElementById("pPzas").value || 0);

      if(!prod){
        alert("Pon el producto.");
        return;
      }
      if(!(kg > 0)){
        alert("Pon kilos > 0 (o usa Tomar peso).");
        return;
      }

      // Aquí va tu lógica real de agregar a la nota (no la toqué).
      console.log("AGREGAR:", {prod, kg, pzas});
      alert(`Agregado: ${prod} — ${kg.toFixed(2)} kg`);
    });

    btnLimpiar?.addEventListener("click", () => {
      document.getElementById("pProducto").value = "";
      document.getElementById("pKg").value = "0";
      document.getElementById("pPzas").value = "0";
      setStatus("Báscula: esperando…", true);
    });
  </script>
</body>
</html>
